    - docker build -t kooldev/php:8.4-debian-swoole-nginx 8.4-debian-swoole-nginx
    - docker build -t kooldev/php:8.4-debian-swoole-nginx-prod 8.4-debian-swoole-nginx-prod
    - docker build --pull -t kooldev/php:8.5-debian-swoole 8.5-debian-swoole
