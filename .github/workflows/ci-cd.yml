name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  repository_dispatch:
    types: [docker-php-updated]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    strategy:
      matrix:
        version: ['8.2-swoole', '8.3-swoole', '8.4-swoole', '8.5-swoole', '8.4-debian-swoole', '8.5-debian-swoole']
        type: ['', '-prod']
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host # needed to push to local registry

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}${{ matrix.type }}
          pull: true
          push: true
          tags: localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }}

      - name: Build and export to Docker (nginx)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}-nginx${{ matrix.type }}
          pull: true
          push: true
          tags: localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }}
          build-contexts: |
            kooldev/php:${{ matrix.version }}${{ matrix.type }}=docker-image://localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }}

      - name: Tests
        run: |
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }} php -r "exit(extension_loaded('swoole') ? 0 : 1);"
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} nginx -v
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} nginx -t
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} supervisord --version
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }} dockerize --version
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} dockerize --version
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }} sh -c 'echo "{{ .Env.TEST_VAR }}" > /tmp/test.tmpl && TEST_VAR=hello dockerize -template /tmp/test.tmpl:/tmp/test.out && test "$(cat /tmp/test.out)" = hello'
          docker run --rm -e ASUSER=1000 localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} php -r "exit(posix_getuid() === 1000 ? 0 : 1);"

      - name: Test Supervisor lifecycle
        run: bash tasks/test-supervisor.sh localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }}

      - name: Tests (dev)
        if: matrix.type == ''
        run: |
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }} node -v
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}${{ matrix.type }} yarn -v
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} node -v
          docker run --rm localhost:5000/kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }} yarn -v

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-swoole'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ['8.2-swoole', '8.3-swoole', '8.4-swoole', '8.5-swoole', '8.4-debian-swoole', '8.5-debian-swoole']
        type: ['', '-prod']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}${{ matrix.type }}
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: kooldev/php:${{ matrix.version }}${{ matrix.type }}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}-nginx${{ matrix.type }}
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: kooldev/php:${{ matrix.version }}-nginx${{ matrix.type }}

  dispatch:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-swoole'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
    steps:
      - name: Check dispatch credential
        id: credential
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set DISPATCH_TOKEN or WORKFLOW_TOKEN with dispatch access to kool-dev/docker-php-oci8."
            exit 1
          fi

      - name: Notify OCI8 after all Swoole tags are published
        id: notify
        run: |
          gh api --method POST repos/kool-dev/docker-php-oci8/dispatches \
            -f event_type=docker-php-swoole-updated

      - name: Summarize publication and downstream notification
        if: always()
        env:
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          DISPATCH_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          {
            echo "### Swoole release propagation"
            echo "- All Swoole publish matrix jobs: success."
            echo "- Dispatch credential check: $CREDENTIAL_OUTCOME."
            echo "- OCI8 docker-php-swoole-updated dispatch: $DISPATCH_OUTCOME."
            echo "- Dispatch acceptance does not confirm OCI8 build or publication completion."
          } >> "$GITHUB_STEP_SUMMARY"
