name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  repository_dispatch:
    types: [docker-php-updated]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
      - id: tags
        run: echo "tags=$(jq -c '[.builds[].name]' fwd-template.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ['8.2-swoole', '8.3-swoole', '8.4-swoole', '8.5-swoole', '8.4-debian-swoole', '8.5-debian-swoole']
        type: ['', '-prod']
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      BASE: ${{ matrix.version }}${{ matrix.type }}
      NGINX: ${{ matrix.version }}-nginx${{ matrix.type }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/action/image-build@c1a0de73a81d63b9b1da74001afd60aa5573470a
        with:
          arch: ${{ env.ARCH }}
      - name: Build fresh base
        id: base
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BASE }}
          platforms: linux/${{ env.ARCH }}
          pull: true
          provenance: false
          load: true
          tags: kooldev/php:${{ env.BASE }}
      - name: Build nginx from same-job base (never force-pull)
        id: nginx
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.NGINX }}
          platforms: linux/${{ env.ARCH }}
          provenance: false
          load: true
          tags: kooldev/php:${{ env.NGINX }}
      - uses: kool-dev/action/image-parent@c1a0de73a81d63b9b1da74001afd60aa5573470a
        with:
          base-ref: kooldev/php:${{ env.BASE }}
          base-id: ${{ steps.base.outputs.imageid }}
          image-id: ${{ steps.nginx.outputs.imageid }}
      - name: Tests
        env:
          BASE_ID: ${{ steps.base.outputs.imageid }}
          NGINX_ID: ${{ steps.nginx.outputs.imageid }}
        run: |
          docker run --rm "$BASE_ID" php -r "exit(extension_loaded('swoole') ? 0 : 1);"
          docker run --rm "$NGINX_ID" nginx -v
          docker run --rm "$NGINX_ID" nginx -t
          docker run --rm "$NGINX_ID" supervisord --version
          docker run --rm "$BASE_ID" dockerize --version
          docker run --rm "$NGINX_ID" dockerize --version
          docker run --rm "$BASE_ID" sh -c 'echo "{{ .Env.TEST_VAR }}" > /tmp/test.tmpl && TEST_VAR=hello dockerize -template /tmp/test.tmpl:/tmp/test.out && test "$(cat /tmp/test.out)" = hello'
          docker run --rm -e ASUSER=1000 "$NGINX_ID" php -r "exit(posix_getuid() === 1000 ? 0 : 1);"
          bash tasks/test-supervisor.sh "$NGINX_ID"
      - name: Tests (dev)
        if: matrix.type == ''
        env:
          BASE_ID: ${{ steps.base.outputs.imageid }}
          NGINX_ID: ${{ steps.nginx.outputs.imageid }}
        run: |
          docker run --rm "$BASE_ID" node -v
          docker run --rm "$BASE_ID" yarn -v
          docker run --rm "$NGINX_ID" node -v
          docker run --rm "$NGINX_ID" yarn -v
      - uses: kool-dev/action/image-stage@c1a0de73a81d63b9b1da74001afd60aa5573470a
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-swoole'
        with:
          canonical-repository: kool-dev/docker-php-swoole
          default-branch: main
          repository: kooldev/php
          arch: ${{ env.ARCH }}
          group: ${{ env.BASE }}
          images: >-
            [{"tag":"${{ env.BASE }}","id":"${{ steps.base.outputs.imageid }}"},
             {"tag":"${{ env.NGINX }}","id":"${{ steps.nginx.outputs.imageid }}"}]
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-swoole'
    uses: kool-dev/action/.github/workflows/image-publish.yml@c1a0de73a81d63b9b1da74001afd60aa5573470a
    with:
      canonical-repository: kool-dev/docker-php-swoole
      default-branch: main
      repository: kooldev/php
      tags: ${{ needs.checks.outputs.tags }}
      tooling-ref: c1a0de73a81d63b9b1da74001afd60aa5573470a
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  dispatch:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-swoole'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify OCI8 after complete publication
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure DISPATCH_TOKEN or WORKFLOW_TOKEN for OCI8 dispatch."
            exit 1
          fi
          gh api --method POST repos/kool-dev/docker-php-oci8/dispatches -f event_type=docker-php-swoole-updated
          echo "- OCI8: dispatch accepted (not downstream completion)." >> "$GITHUB_STEP_SUMMARY"
